# Keeps the Render free instance warm during the hours anyone would plausibly
# open the link, without burning the monthly instance-hour allowance.
#
# THE ARITHMETIC (this schedule is not arbitrary):
#
#   Render gives 750 free instance-hours per workspace per month. An instance
#   kept awake 24/7 uses 24 x 31 = 744 hours in a 31-day month. That fits, but
#   with six hours of margin and nothing left over — a second free service in
#   the same workspace would push it over and both would be suspended.
#
#   This workflow pings only between 02:30 and 18:30 UTC, which is 08:00 to
#   00:00 IST — the waking hours of the audience for an NSE tool. That is 16
#   hours a day, so 16 x 31 = 496 instance-hours at the very most, and in
#   practice less because the instance still sleeps during gaps. Roughly a
#   third of the allowance stays free.
#
#   Outside that window a visitor pays one cold start. Measured at 27.2 s and
#   26.4 s on this deployment (Neon resuming plus Render booting, since /health
#   queries the database), which the frontend handles explicitly rather than
#   appearing to hang.
#
# WHY EVERY 10 MINUTES:
#
#   Render suspends a free instance after 15 minutes without a request. GitHub
#   Actions cron is best-effort and routinely fires several minutes late under
#   load — it is not a guaranteed scheduler. A 10-minute interval leaves five
#   minutes of slack against the 15-minute timeout, so a typical delay does not
#   let the instance fall asleep. A 14-minute interval would have no margin.

name: Keep backend awake

on:
  schedule:
    # Every 10 minutes, 02:30-18:29 UTC. Cron has no "every 10 minutes from
    # HH:30" form, so the half-hour offset is written as two ranges:
    #   :30,:40,:50 of hours 02-18, and :00,:10,:20 of hours 03-18.
    - cron: "30,40,50 2-18 * * *"
    - cron: "0,10,20 3-18 * * *"
  # So the workflow can be proven to run without waiting for the schedule.
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          # Set this repository variable to the Render URL, e.g.
          # https://riskfrontier-api.onrender.com
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          set -euo pipefail

          if [ -z "${BACKEND_URL:-}" ]; then
            echo "::error::Repository variable BACKEND_URL is not set."
            echo "Set it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          # A sleeping instance takes up to ~60 s to answer the first request,
          # so allow for that and retry rather than failing the run on a cold
          # start. --max-time covers the whole attempt including the wake-up.
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}..."
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
                     --max-time 90 --retry 0 \
                     "${BACKEND_URL}/health" || echo "000")

            if [ "$code" = "200" ]; then
              echo "OK ($code): $(cat /tmp/health.json)"
              # Confirm the database is actually reachable, not just the app.
              if grep -q '"db":"connected"' /tmp/health.json; then
                exit 0
              fi
              echo "::warning::App responded but the database is not connected."
              cat /tmp/health.json
              exit 1
            fi

            echo "::warning::Attempt ${attempt} returned ${code}; retrying in 30 s."
            sleep 30
          done

          echo "::error::/health did not return 200 after 3 attempts."
          exit 1
