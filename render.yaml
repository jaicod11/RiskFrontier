# Render blueprint for the RiskFrontier API.
#
# There is deliberately NO `databases:` block. Render's free Postgres is
# deleted 30 days after creation, which would silently take the site down; the
# database lives on Neon's permanent free tier instead. DATABASE_URL is set in
# the Render dashboard to the Neon connection string.
#
# Deploy: connect this repo in Render, which reads this file. Then fill the
# values marked `sync: false` in the dashboard — they are secrets or
# environment-specific and are intentionally not committed.

services:
  - type: web
    name: riskfrontier-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore          # closest to the NSE data's audience
    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: production      # makes missing config fail at boot, not at first query
      - key: DEBUG
        value: "false"

      # --- Secrets, set in the dashboard ---------------------------------
      # Neon POOLED connection string (host contains "-pooler"). Must include
      # ?sslmode=require. This is what the application engine uses.
      - key: DATABASE_URL
        sync: false
      # Neon DIRECT connection string (same host without "-pooler"). Used by
      # Alembic only: the pooled endpoint runs transaction pooling, which does
      # not preserve the session state migrations need.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # The deployed Vercel domain, e.g. https://riskfrontier\.vercel\.app
      # A regex covers preview deployments, which get a new subdomain per commit.
      - key: CORS_ORIGIN_REGEX
        sync: false

      # --- Connection pool ------------------------------------------------
      # Neon scales to zero when idle and charges for connections; a 512 MB
      # instance has no use for many. pool_pre_ping (set in code) replaces a
      # connection the database dropped while asleep.
      - key: DB_REQUIRE_SSL
        value: "true"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "280"
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "15"

      # --- Request budgets --------------------------------------------------
      # Set from timings MEASURED ON THIS INSTANCE, not extrapolated. Render's
      # shared CPU runs 5-9x slower than a local M-series machine:
      #
      #   endpoint                                  local     prod
      #   /api/securities                           0.37 s    0.48 s
      #   VaR 10k sims / 10d                        0.49 s    0.81 s
      #   optimize, 30 frontier points              2.60 s   12.26 s
      #   backtest, 8 years monthly                 0.49 s    3.17 s
      #   bootstrap rolling, constant-mix           1.91 s   16.18 s
      #   bootstrap rolling, walk-forward           2.59 s   24.18 s
      #
      # Worst case at each cap, measured on prod:
      #   MAX_N_SIMS 50k at the 252-day horizon ............ 17.9 s  (kept)
      #   MAX_BOOTSTRAP_RESAMPLES 300, block constant-mix ... 83.0 s  (too slow)
      #                           150 ...................... 38.7 s  (chosen)
      #   MAX_WALK_FORWARD_BLOCK_RESAMPLES 15 ............. 129.9 s  (too slow)
      #                                    10 .............. 81.1 s  (the floor)
      #
      # 10 is the schema minimum for n_resamples, so 81 s is the cheapest this
      # combination can be on this hardware — it re-optimises on every resample
      # and cannot reuse the cache. rolling_windows runs the same walk-forward
      # strategy in 24 s and is the primary method; the 422 for this
      # combination points there.
      - key: MAX_N_SIMS
        value: "50000"
      - key: MAX_BOOTSTRAP_RESAMPLES
        value: "150"
      - key: MAX_WALK_FORWARD_BLOCK_RESAMPLES
        value: "10"

      # --- Server -----------------------------------------------------------
      # One worker: the import graph alone is 176 MB resident and the slow
      # paths are CPU-bound, so a second worker would contend rather than help.
      - key: WEB_CONCURRENCY
        value: "1"
      # Must exceed the slowest permitted request.
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: PYTHONUNBUFFERED
        value: "1"

    # Migrations run before the new version receives traffic. Idempotent, so a
    # redeploy with no new migrations is a no-op.
    preDeployCommand: alembic upgrade head
